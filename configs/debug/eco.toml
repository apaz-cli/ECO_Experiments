#!/tmp/eco/run_config.sh

# Debug config for ECO validation. Quick smoke test on 1 GPU.

[job]
dump_folder = "./outputs/debug_eco"
description = "Debug ECO validation"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = false
enable_aim = true

[model]
name = "llama3"
flavor = "debugmodel"
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "ECOAdamW"
lr = 8e-4
beta1 = 0.9
beta2 = 0.98
eps = 1e-9
weight_decay = 0.1

[eco]
enabled = true
quantize_weights = true
quant_dtype = "fp8"
heuristic_log_freq = 1
stochastic_rounding = true

[lr_scheduler]
warmup_steps = 4000
decay_ratio = 0.2
decay_type = "linear"

[training]
local_batch_size = 8
seq_len = 2048
max_norm = 1.0
steps = 20000
dataset = "fineweb_edu_sample10bt"
dataset_path = "/mnt/skraid0/fineweb"

[validation]
enable = false
dataset = "fineweb_edu_sample10bt"
dataset_path = "/mnt/skraid0/fineweb"
