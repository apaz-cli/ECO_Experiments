#!/tmp/eco/run_config.sh

# Debug config for BF16 baseline (no quantization, no ECO).

[job]
dump_folder = "./outputs/debug_baseline"
description = "Debug BF16 baseline"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = false
enable_aim = true

[model]
name = "llama3"
flavor = "debugmodel"
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "ECOAdamW"

[optimizer.adamw]
lr = 8e-4
beta1 = 0.9
beta2 = 0.98
eps = 1e-9
weight_decay = 0.1

[eco]
enabled = false
quantize_weights = true
quant_dtype = "bf16"

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8
decay_type = "linear"
min_lr_factor = 0.1

[training]
local_batch_size = 8
seq_len = 2048
max_norm = 1.0
steps = 20
dataset = "c4"
dataset_path = "/home/aaron/c4/"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "selective"
selective_ac_option = "2"

[compile]
enable = false
components = ["model", "loss"]

[validation]
enable = false
dataset = "c4"
dataset_path = "/home/aaron/c4/"
