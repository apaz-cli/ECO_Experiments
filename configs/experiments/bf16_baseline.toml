#!/tmp/eco/run_config.sh

# BF16 baseline with no master weights (mixed precision training).
# This corresponds to "BF16 w/ MW" baseline in the ECO paper (FP32 master weights with BF16 compute).
# Actually paper's "BF16 w/ MW" uses FP32 master weights, but this config simulates BF16 storage.
# For true BF16 mixed precision baseline, use training.dtype = "bfloat16" and eco.quantize_weights = false.
#
# Based on ECO paper hyperparameters:
#   - AdamW, beta1=0.9, beta2=0.98, eps=1e-9, wd=0.1, grad clip 1.0
#   - LR scaling: 1.2e-3 * 50M/N_params (QUEST scaling law)
#   - Linear warmup (10% steps), cosine decay to 0.1x peak
#   - T5 tokenizer (vocab=32100)
#   - 50N tokens total, batch=256 seqs, seq_len=512 (half paper token budget)
#
# Usage: Override model.flavor, optimizer.lr, lr_scheduler.warmup_steps, training.steps

[job]
dump_folder = "./outputs/bf16_baseline"
description = "BF16 baseline (simulated BF16 storage)"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = false
enable_exp = true

[model]
name = "llama3"
flavor = "50M"
# T5 tokenizer (vocab=32100, matches ECO paper)
hf_assets_path = "./assets/tokenizers/t5-base"

[optimizer]
name = "ECOAdamW"

[optimizer.adamw]
lr = 6e-4  # Override per model size: 6e-4 for 100M, 1.5e-4 for 430M, etc.
beta1 = 0.9
beta2 = 0.98
eps = 1e-9
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 3815  # Override: 10% of total steps
decay_type = "cosine"
min_lr_factor = 0.1

[training]
local_batch_size = 32
global_batch_size = 256
seq_len = 512
max_norm = 1.0
steps = 38147  # Override per model: 50N tokens / (256*512)
dataset = "c4"
dataset_path = "/home/aaron/c4/"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false
components = ["model", "loss"]

[eco]
enabled = false
quantize_weights = true
quant_dtype = "bf16"
heuristic_log_freq = 1
stochastic_rounding = false
master_weights_dtype = "none"  # No master weights (simulated BF16 storage)
activation_dtype = "none"    # No activation quantization for BF16 baseline

[validation]
enable = false
dataset = "c4"
dataset_path = "/home/aaron/c4/"
seq_len = 512
freq = 2000
steps = -1
