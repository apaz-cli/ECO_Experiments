#!/tmp/eco/run_config.sh

# Master config for ECO experiments.
# This is the base configuration for all scaling law experiments (100M-800M models).
# Model-specific parameters (flavor, lr, steps, warmup_steps) should be overridden via CLI.
#
# Based on the ECO paper hyperparameters:
#   - AdamW, beta1=0.9, beta2=0.98, eps=1e-9, wd=0.1, grad clip 1.0
#   - LR scaling: 1.2e-3 * 50M/N_params (QUEST scaling law)
#   - Linear warmup (10% steps), cosine decay to 0.1x peak
#   - T5 tokenizer (vocab=32100)
#   - 100N tokens total, batch=512 seqs, seq_len=512
#
# Usage: Override model.flavor, optimizer.lr, lr_scheduler.warmup_steps, training.steps

[job]
dump_folder = "./outputs/experiment"
description = "ECO experiment run"

[profiling]
enable_profiling = false

[metrics]
log_freq = 10
enable_tensorboard = false
enable_aim = true

[model]
name = "llama3"
flavor = "100M"  # Override per experiment: 100M, 430M, etc.
# T5 tokenizer (vocab=32100, matches ECO paper)
hf_assets_path = "./assets/tokenizers/t5-base"

[optimizer]
name = "ECOAdamW"
lr = 6e-4  # Override per model size: 6e-4 for 100M, 1.5e-4 for 430M, etc.
beta1 = 0.9
beta2 = 0.98
eps = 1e-9
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 3815  # Override: 10% of total steps
decay_type = "cosine"
min_lr_factor = 0.1

[training]
local_batch_size = 64
global_batch_size = 512
seq_len = 512
max_norm = 1.0
steps = 38147  # Override per model: 100N tokens / (512*512)
dataset = "fineweb_edu_sample10bt"
dataset_path = "/mnt/skraid0/fineweb"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false
components = ["model", "loss"]

[eco]
enabled = false
quantize_weights = true
quant_dtype = "bf16"
heuristic_log_freq = 1
stochastic_rounding = false

[validation]
enable = false
dataset = "fineweb_edu_sample10bt"
dataset_path = "/mnt/skraid0/fineweb"
seq_len = 512
freq = 2000
steps = -1
