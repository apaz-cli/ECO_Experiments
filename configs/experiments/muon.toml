#!/tmp/eco/run_config.sh

# Muon ECO experiments configuration.
# Tests ECO approaches for the Muon optimizer (Newton-Schulz momentum).
#
# Based on ECO paper hyperparameters but adapted for Muon:
#   - Muon optimizer with momentum=0.95, Newton-Schulz 5 iterations
#   - Falls back to Adam for 1D params (biases, norms)
#   - LR scaling: 3e-4 (typical Muon LR, ~4x lower than Adam)
#   - Linear warmup (10% steps), cosine decay to 0.1x peak
#   - T5 tokenizer (vocab=32100)
#   - 50N tokens total, batch=256 seqs, seq_len=512 (half paper token budget)
#
# Usage: Override model.flavor, eco.approach via CLI or sweep

[job]
dump_folder = "./outputs/muon_experiment"
description = "Muon ECO approach comparison"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = false
enable_aim = true

[model]
name = "llama3"
flavor = "100M"  # Override per experiment: 100M, 430M, etc.
# T5 tokenizer (vocab=32100, matches ECO paper)
hf_assets_path = "./assets/tokenizers/t5-base"

[optimizer]
name = "ECOMuon"

[optimizer.muon]
lr = 3e-4  # Muon typically uses lower LR than Adam
momentum = 0.95
weight_decay = 0.0  # Muon typically doesn't use weight decay

[optimizer.adamw]
lr = 3e-3  # For 1D params (biases, norms, embeddings)
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
weight_decay = 0.0

[lr_scheduler]
warmup_steps = 3815  # Override: 10% of total steps
decay_type = "cosine"
min_lr_factor = 0.1

[training]
local_batch_size = 32
global_batch_size = 256
seq_len = 512
max_norm = 1.0
steps = 38147  # Override per model: 50N tokens / (256*512)
dataset = "fineweb_edu_sample10bt"
dataset_path = "/mnt/skraid0/fineweb"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
enable = true
interval = 999999999  # final step only

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false
components = ["model", "loss"]

[eco]
enabled = true
approach = "frobenius"  # ["pre_ns", "naive_sgdm", "frobenius", "jacobian"]
quantize_weights = true
quant_dtype = "fp8"
heuristic_log_freq = 1
stochastic_rounding = false
master_weights_dtype = "none"  # ["none", "fp32", "bf16"] - none=pure ECO, fp32=baseline

[validation]
enable = false
dataset = "fineweb_edu_sample10bt"
dataset_path = "/mnt/skraid0/fineweb"
seq_len = 512
freq = 2000
steps = -1
