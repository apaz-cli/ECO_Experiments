#!/tmp/eco/run_config.sh

# Llama 430M with ECO for scaling law replication.
# Matches QUEST/ECO paper settings exactly:
#   - 100N tokens (43B for 430M), batch=512 seqs, seq_len=512
#   - AdamW, beta1=0.9, beta2=0.98, eps=1e-9, wd=0.1, grad clip 1.0
#   - LR=1.5e-4 (QUEST scaling: 1.2e-3 * 50M/430M)
#   - Linear warmup (10% steps), cosine decay to 0.1x peak
#   - T5 tokenizer (vocab=32100)
# Total tokens/step = 512 * 512 = 262144. Steps = 43B / 262144 = 164032.

[job]
dump_folder = "./outputs/llama3_430m_eco"
description = "Llama 430M ECO scaling law"

[profiling]
enable_profiling = false

[metrics]
log_freq = 10
enable_tensorboard = false
enable_aim = true

[model]
name = "llama3"
flavor = "430M"
# T5 tokenizer (vocab=32100, matches ECO paper)
hf_assets_path = "./assets/tokenizers/t5-base"
# Alternative: Llama tokenizer (uncomment and update flavor vocab_size override)
# hf_assets_path = "./assets/hf/Llama-3.1-8B"
converters = ["quantize.linear.float8", "eco"]

[optimizer]
name = "AdamW"
lr = 1.5e-4
beta1 = 0.9
beta2 = 0.98
eps = 1e-9
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 16403
decay_type = "cosine"
min_lr_factor = 0.1

[training]
local_batch_size = 64
global_batch_size = 512
seq_len = 512
max_norm = 1.0
steps = 164032
dataset = "c4"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
enable = true
folder = "checkpoint"
interval = 20000
last_save_model_only = true
async_mode = "disabled"

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false
components = ["model", "loss"]

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

[eco]
enabled = true
heuristic_log_freq = 2000
stochastic_rounding = true

[validation]
enable = true
dataset = "c4_validation"
freq = 5000
steps = -1
