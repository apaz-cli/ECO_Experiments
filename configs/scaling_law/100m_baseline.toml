#!/tmp/eco/run_config.sh

# Llama 100M BF16 baseline for scaling law replication.
# Matches ECO config hyperparameters for fair comparison.
#   - 100N tokens (10B for 100M), batch=512 seqs, seq_len=512
#   - AdamW, beta1=0.9, beta2=0.98, eps=1e-9, wd=0.1, grad clip 1.0
#   - LR=6e-4 (QUEST scaling: 1.2e-3 * 50M/100M)
#   - Linear warmup (10% steps), cosine decay to 0.1x peak
#   - T5 tokenizer (vocab=32100)
# Total tokens/step = 512 * 512 = 262144. Steps = 10B / 262144 = 38147.

[job]
dump_folder = "./outputs/llama3_100m_baseline"
description = "Llama 100M BF16 baseline scaling law"

[profiling]
enable_profiling = false

[metrics]
log_freq = 10
enable_tensorboard = false
enable_aim = true

[model]
name = "llama3"
flavor = "100M"
# T5 tokenizer (vocab=32100, matches ECO paper)
hf_assets_path = "./assets/tokenizers/t5-base"

[optimizer]
name = "AdamW"
lr = 6e-4
beta1 = 0.9
beta2 = 0.98
eps = 1e-9
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 3815
decay_type = "cosine"
min_lr_factor = 0.1

[training]
local_batch_size = 64
global_batch_size = 512
seq_len = 512
max_norm = 1.0
steps = 38147
dataset = "c4"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false
components = ["model", "loss"]

[validation]
enable = true
dataset = "c4_validation"
freq = 2000
steps = -1
